name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: AdGuardTray/AdGuardTray.csproj

      - name: Restore
        run: dotnet restore AdGuardTray/AdGuardTray.csproj

      - name: Build
        run: dotnet build AdGuardTray/AdGuardTray.csproj --configuration Release --no-restore

      - name: Publish Windows build
        run: dotnet publish AdGuardTray/AdGuardTray.csproj --configuration Release --no-build --output artifacts/AdGuardTray

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdGuardTray-windows
          path: artifacts/AdGuardTray
          if-no-files-found: error
